    <circle cx="48" cy="40" r="0.7" fill="#00d4ff"/><circle cx="96" cy="40" r="0.7" fill="#00d4ff"/><circle cx="144" cy="40" r="0.7" fill="#00d4ff"/><circle cx="192" cy="40" r="0.7" fill="#00d4ff"/><circle cx="240" cy="40" r="0.7" fill="#00d4ff"/><circle cx="288" cy="40" r="0.7" fill="#00d4ff"/><circle cx="336" cy="40" r="0.7" fill="#00d4ff"/><circle cx="384" cy="40" r="0.7" fill="#00d4ff"/><circle cx="432" cy="40" r="0.7" fill="#00d4ff"/><circle cx="480" cy="40" r="0.7" fill="#00d4ff"/><circle cx="528" cy="40" r="0.7" fill="#00d4ff"/><circle cx="576" cy="40" r="0.7" fill="#00d4ff"/><circle cx="624" cy="40" r="0.7" fill="#00d4ff"/><circle cx="672" cy="40" r="0.7" fill="#00d4ff"/><circle cx="720" cy="40" r="0.7" fill="#00d4ff"/><circle cx="768" cy="40" r="0.7" fill="#00d4ff"/><circle cx="816" cy="40" r="0.7" fill="#00d4ff"/><circle cx="864" cy="40" r="0.7" fill="#00d4ff"/><circle cx="912" cy="40" r="0.7" fill="#00d4ff"/><circle cx="960" cy="40" r="0.7" fill="#00d4ff"/><circle cx="1008" cy="40" r="0.7" fill="#00d4ff"/><circle cx="1056" cy="40" r="0.7" fill="#00d4ff"/><circle cx="1104" cy="40" r="0.7" fill="#00d4ff"/><circle cx="1152" cy="40" r="0.7" fill="#00d4ff"/>
    <circle cx="48" cy="80" r="0.7" fill="#00d4ff"/><circle cx="96" cy="80" r="0.7" fill="#00d4ff"/><circle cx="144" cy="80" r="0.7" fill="#00d4ff"/><circle cx="192" cy="80" r="0.7" fill="#00d4ff"/><circle cx="240" cy="80" r="0.7" fill="#00d4ff"/><circle cx="288" cy="80" r="0.7" fill="#00d4ff"/><circle cx="336" cy="80" r="0.7" fill="#00d4ff"/><circle cx="384" cy="80" r="0.7" fill="#00d4ff"/><circle cx="432" cy="80" r="0.7" fill="#00d4ff"/><circle cx="480" cy="80" r="0.7" fill="#00d4ff"/><circle cx="528" cy="80" r="0.7" fill="#00d4ff"/><circle cx="576" cy="80" r="0.7" fill="#00d4ff"/><circle cx="624" cy="80" r="0.7" fill="#00d4ff"/><circle cx="672" cy="80" r="0.7" fill="#00d4ff"/><circle cx="720" cy="80" r="0.7" fill="#00d4ff"/><circle cx="768" cy="80" r="0.7" fill="#00d4ff"/><circle cx="816" cy="80" r="0.7" fill="#00d4ff"/><circle cx="864" cy="80" r="0.7" fill="#00d4ff"/><circle cx="912" cy="80" r="0.7" fill="#00d4ff"/><circle cx="960" cy="80" r="0.7" fill="#00d4ff"/><circle cx="1008" cy="80" r="0.7" fill="#00d4ff"/><circle cx="1056" cy="80" r="0.7" fill="#00d4ff"/><circle cx="1104" cy="80" r="0.7" fill="#00d4ff"/><circle cx="1152" cy="80" r="0.7" fill="#00d4ff"/>

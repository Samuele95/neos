  <!-- Top gradient line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#line-f)" opacity="0.6"/>
  <!-- Psi symbol -->
  <text x="600" y="55" text-anchor="middle" fill="url(#psi-grad)" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" filter="url(#glow-f)">Ψ</text>
  <!-- Quote -->
  <text x="600" y="85" text-anchor="middle" fill="#8888a0" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic">"What something MEANS persists; how it WORKS changes."</text>
  <!-- Version -->
  <text x="600" y="115" text-anchor="middle" fill="#444" font-family="system-ui, sans-serif" font-size="12" letter-spacing="0.1em">NEOS v1.0 — Think once. Reason anywhere.</text>
  <!-- Tagline -->
  <text x="600" y="140" text-anchor="middle" fill="#333" font-family="system-ui, sans-serif" font-size="10" font-style="italic">Generated by a field. Run on a field. About the field.</text>
</svg>

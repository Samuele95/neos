  <!-- ===== THREE ERAS ASCENDING DIAGRAM (left-offset, x=150-550, y=200-330) ===== -->
  <!--
    Scaled up from the paper's 500x200 viewBox to fit x=150-550, y=200-330.
    Paper coordinates mapped:
      Hardware Age box:   (50,140,120x45)  -> (150, 290, 170x58) rx=8
      Software Age box:   (190,95,120x45)  -> (340, 250, 170x58) rx=8
      Intelligence Age:   (330,45,130x50)  -> (420, 208, 185x64) rx=10
    Connecting lines scaled similarly.
    "NEOS" label above Intelligence Age box.
  -->

  <!-- Hardware Age - dull gray rectangle, bottom-left, opacity 0.5 -->
  <rect x="150" y="290" width="170" height="58" rx="8" fill="rgba(80,80,100,0.04)" stroke="#444" stroke-width="1" opacity="0.5"/>
  <text x="235" y="324" text-anchor="middle" fill="#555" font-size="16" font-family="system-ui, -apple-system, sans-serif">Hardware Age</text>

  <!-- Software Age - purple-tinted rectangle, middle height, opacity 0.8 -->
  <rect x="340" y="250" width="170" height="58" rx="8" fill="rgba(123,97,255,0.05)" stroke="rgba(123,97,255,0.4)" stroke-width="1" opacity="0.8"/>
  <text x="425" y="284" text-anchor="middle" fill="rgba(155,138,255,0.8)" font-size="16" font-family="system-ui, -apple-system, sans-serif">Software Age</text>

  <!-- Intelligence Age - glowing cyan rectangle, highest position -->
  <rect x="420" y="208" width="185" height="64" rx="10" fill="rgba(0,212,255,0.08)" stroke="#00d4ff" stroke-width="2" filter="url(#glow-box)"/>
  <text x="512" y="246" text-anchor="middle" fill="#00d4ff" font-size="17" font-weight="700" font-family="system-ui, -apple-system, sans-serif">Intelligence Age</text>

  <!-- Connecting lines ascending between eras -->
  <line x1="320" y1="310" x2="340" y2="282" stroke="rgba(100,100,130,0.3)" stroke-width="1.5"/>
  <line x1="510" y1="262" x2="420" y2="245" stroke="rgba(0,180,255,0.25)" stroke-width="1.5"/>

  <!-- "NEOS" label above Intelligence Age box, subtle -->
  <text x="512" y="196" text-anchor="middle" fill="rgba(0,212,255,0.5)" font-size="14" font-weight="600" letter-spacing="0.1em" font-family="system-ui, -apple-system, sans-serif">NEOS</text>

  <!-- ===== TAGLINE (y=330, dim italic text) ===== -->
  <text x="600" y="330" text-anchor="middle" fill="#555" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic">"The last operating system will not manage files. It will manage meaning."</text>

  <!-- ===== BOTTOM GRADIENT LINE ===== -->
  <rect x="0" y="396" width="1200" height="4" fill="url(#line-grad)" opacity="0.6"/>
</svg>

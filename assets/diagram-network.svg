<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300">
  <defs>
    <!-- Glow filter for node circles -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle glow for attractor boundary -->
    <filter id="glow-boundary" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="300" fill="#07070c"/>

  <!-- ===== Attractor boundary ===== -->
  <ellipse cx="250" cy="155" rx="210" ry="130"
           fill="none" stroke="rgba(0,212,255,0.15)" stroke-width="1"
           stroke-dasharray="6,4" filter="url(#glow-boundary)"/>
  <!-- Attractor label -->
  <text x="250" y="14" text-anchor="middle"
        fill="#0af" font-family="monospace" font-size="10"
        letter-spacing="0.02em" opacity="0.85">defensive_quality &#183; C=0.71</text>

  <!-- ===== Resonance edges (drawn first, behind nodes) ===== -->

  <!-- security <-> input_validation  R=0.91  (thickest) -->
  <line x1="250" y1="70" x2="120" y2="155"
        stroke="rgba(0,212,255,0.40)" stroke-width="3.0"/>
  <text x="174" y="105" text-anchor="middle"
        fill="#888" font-family="monospace" font-size="8"
        transform="rotate(-33,174,105)">R=0.91</text>

  <!-- edge_case <-> error_handling  R=0.85 -->
  <line x1="380" y1="155" x2="250" y2="250"
        stroke="rgba(0,212,255,0.35)" stroke-width="2.8"/>
  <text x="326" y="210" text-anchor="middle"
        fill="#888" font-family="monospace" font-size="8"
        transform="rotate(36,326,210)">R=0.85</text>

  <!-- correctness <-> edge_case  R=0.82 -->
  <line x1="120" y1="155" x2="380" y2="155"
        stroke="rgba(0,212,255,0.30)" stroke-width="2.4"/>
  <text x="250" y="147" text-anchor="middle"
        fill="#888" font-family="monospace" font-size="8">R=0.82</text>

  <!-- security <-> no_leaked_secrets  R=0.79 -->
  <line x1="250" y1="70" x2="380" y2="155"
        stroke="rgba(0,180,220,0.25)" stroke-width="2.0"/>
  <text x="326" y="105" text-anchor="middle"
        fill="#888" font-family="monospace" font-size="8"
        transform="rotate(33,326,105)">R=0.79</text>

  <!-- security <-> edge_case  R=0.74 -->
  <line x1="250" y1="70" x2="250" y2="250"
        stroke="rgba(0,180,220,0.22)" stroke-width="1.6"/>
  <text x="263" y="162" text-anchor="start"
        fill="#888" font-family="monospace" font-size="8">R=0.74</text>

  <!-- correctness <-> error_handling  R=0.72 -->
  <line x1="120" y1="155" x2="250" y2="250"
        stroke="rgba(0,180,220,0.18)" stroke-width="1.2"/>

  <!-- ===== Pattern nodes ===== -->

  <!-- security_no_injection  (top, largest, r=28) -->
  <circle cx="250" cy="70" r="28"
          fill="rgba(0,212,255,0.2)" stroke="#0af" stroke-width="1.2"
          filter="url(#glow-cyan)"/>
  <text x="250" y="67" text-anchor="middle"
        fill="#0af" font-family="monospace" font-size="7.5"
        font-weight="600">security</text>
  <text x="250" y="79" text-anchor="middle"
        fill="#0af" font-family="monospace" font-size="10"
        font-weight="700" opacity="0.9">0.95</text>

  <!-- correctness  (left, r=24) -->
  <circle cx="120" cy="155" r="24"
          fill="rgba(0,212,255,0.2)" stroke="#0af" stroke-width="1.2"
          filter="url(#glow-cyan)"/>
  <text x="120" y="152" text-anchor="middle"
        fill="#0af" font-family="monospace" font-size="7.5"
        font-weight="600">correctness</text>
  <text x="120" y="164" text-anchor="middle"
        fill="#0af" font-family="monospace" font-size="10"
        font-weight="700" opacity="0.9">0.90</text>

  <!-- edge_case_handling  (right, r=22) -->
  <circle cx="380" cy="155" r="22"
          fill="rgba(0,180,220,0.2)" stroke="#0ad" stroke-width="1.2"
          filter="url(#glow-cyan)"/>
  <text x="380" y="152" text-anchor="middle"
        fill="#0ad" font-family="monospace" font-size="7"
        font-weight="600">edge_case</text>
  <text x="380" y="164" text-anchor="middle"
        fill="#0ad" font-family="monospace" font-size="10"
        font-weight="700" opacity="0.9">0.85</text>

  <!-- input_validation  (top-left, r=22) -->
  <circle cx="100" cy="70" r="22"
          fill="rgba(0,180,220,0.2)" stroke="#0ad" stroke-width="1.2"
          filter="url(#glow-cyan)"/>
  <text x="100" y="67" text-anchor="middle"
        fill="#0ad" font-family="monospace" font-size="7"
        font-weight="600">validation</text>
  <text x="100" y="79" text-anchor="middle"
        fill="#0ad" font-family="monospace" font-size="10"
        font-weight="700" opacity="0.9">0.90</text>

  <!-- no_leaked_secrets  (top-right, r=20) -->
  <circle cx="400" cy="70" r="20"
          fill="rgba(0,160,200,0.18)" stroke="#09b" stroke-width="1.0"/>
  <text x="400" y="67" text-anchor="middle"
        fill="#09b" font-family="monospace" font-size="7"
        font-weight="600">no_leaks</text>
  <text x="400" y="79" text-anchor="middle"
        fill="#09b" font-family="monospace" font-size="10"
        font-weight="700" opacity="0.9">0.88</text>

  <!-- error_handling  (bottom, r=20) -->
  <circle cx="250" cy="250" r="20"
          fill="rgba(0,160,200,0.18)" stroke="#09b" stroke-width="1.0"/>
  <text x="250" y="247" text-anchor="middle"
        fill="#09b" font-family="monospace" font-size="7"
        font-weight="600">err_handle</text>
  <text x="250" y="258" text-anchor="middle"
        fill="#09b" font-family="monospace" font-size="10"
        font-weight="700" opacity="0.9">0.85</text>

  <!-- ===== Node external labels ===== -->
  <text x="250" y="36" text-anchor="middle"
        fill="#556" font-family="monospace" font-size="8"
        letter-spacing="0.02em">security_no_injection</text>
  <text x="55" y="155" text-anchor="middle"
        fill="#556" font-family="monospace" font-size="8"
        letter-spacing="0.02em">correctness</text>
  <text x="380" y="132" text-anchor="middle"
        fill="#556" font-family="monospace" font-size="8"
        letter-spacing="0.02em">edge_case_handling</text>
  <text x="250" y="282" text-anchor="middle"
        fill="#556" font-family="monospace" font-size="8"
        letter-spacing="0.02em">error_handling</text>
</svg>

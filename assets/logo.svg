<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#07070c"/>
    </linearGradient>

    <!-- Field activation gradient (cyan core bump) -->
    <radialGradient id="field-bump" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#7b61ff" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#ff3d8e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#07070c" stop-opacity="0"/>
    </radialGradient>

    <!-- Mexican hat kernel profile gradient -->
    <linearGradient id="kernel-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3d8e" stop-opacity="0"/>
      <stop offset="25%" stop-color="#ff3d8e" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#7b61ff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#00d4ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#7b61ff" stop-opacity="0.3"/>
      <stop offset="75%" stop-color="#ff3d8e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff3d8e" stop-opacity="0"/>
    </linearGradient>

    <!-- Text gradient -->
    <linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7b61ff"/>
    </linearGradient>

    <!-- Accent line gradient -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7b61ff"/>
      <stop offset="100%" stop-color="#ff3d8e" stop-opacity="0"/>
    </linearGradient>

    <!-- Contour colors -->
    <linearGradient id="contour-hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow-core" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="glow-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="glow-text" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="glow-faint" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>

    <!-- Clip -->
    <clipPath id="rc">
      <rect width="512" height="512" rx="80" ry="80"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" ry="80" fill="url(#bg)"/>

  <!-- Subtle grid (spatial domain x) -->
  <g opacity="0.035" clip-path="url(#rc)">
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <line x1="14" y1="0" x2="14" y2="28" stroke="#00b4ff" stroke-width="0.4"/>
      <line x1="0" y1="14" x2="28" y2="14" stroke="#00b4ff" stroke-width="0.4"/>
    </pattern>
    <rect width="512" height="512" fill="url(#grid)"/>
  </g>

  <!-- ============================================= -->
  <!-- NEURAL FIELD: u(x,t) activation landscape    -->
  <!-- Topographic contour lines of the field        -->
  <!-- Primary bump centered at (256, 200)           -->
  <!-- ============================================= -->

  <!-- Deep ambient field glow -->
  <circle cx="256" cy="200" r="170" fill="url(#field-bump)" opacity="0.3"/>

  <!-- === CONTOUR LINES of u(x,t) — level sets === -->
  <!-- These represent iso-activation curves of the neural field -->
  <!-- Outermost contours: inhibitory surround (pink/red, negative activation) -->
  <g filter="url(#glow-faint)">
    <!-- Inhibitory surround contour (w < 0 region of Mexican hat) -->
    <ellipse cx="256" cy="200" rx="158" ry="148" fill="none" stroke="#ff3d8e" stroke-width="0.6" stroke-opacity="0.12" stroke-dasharray="4 6"/>
    <ellipse cx="256" cy="200" rx="145" ry="136" fill="none" stroke="#ff3d8e" stroke-width="0.7" stroke-opacity="0.18" stroke-dasharray="3 5"/>
  </g>

  <!-- Transition contours (purple — zero-crossing of kernel) -->
  <ellipse cx="256" cy="200" rx="128" ry="120" fill="none" stroke="#7b61ff" stroke-width="0.8" stroke-opacity="0.15"/>
  <ellipse cx="256" cy="200" rx="115" ry="108" fill="none" stroke="#7b61ff" stroke-width="0.9" stroke-opacity="0.2"/>

  <!-- Excitatory contours (cyan — positive activation region) -->
  <g filter="url(#glow-soft)">
    <ellipse cx="256" cy="200" rx="98" ry="92" fill="none" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.2"/>
    <ellipse cx="256" cy="200" rx="82" ry="77" fill="none" stroke="#00d4ff" stroke-width="1.0" stroke-opacity="0.28"/>
    <ellipse cx="256" cy="200" rx="65" ry="61" fill="none" stroke="#00d4ff" stroke-width="1.2" stroke-opacity="0.35"/>
    <ellipse cx="256" cy="200" rx="48" ry="45" fill="none" stroke="#00d4ff" stroke-width="1.4" stroke-opacity="0.45"/>
    <ellipse cx="256" cy="200" rx="32" ry="30" fill="none" stroke="#00d4ff" stroke-width="1.6" stroke-opacity="0.55"/>
  </g>

  <!-- === PEAK ACTIVATION BUMP === -->
  <!-- The "bump solution" — stable localized activation in neural field theory -->
  <circle cx="256" cy="200" r="24" fill="#00d4ff" fill-opacity="0.1" filter="url(#glow-core)"/>
  <circle cx="256" cy="200" r="16" fill="#00d4ff" fill-opacity="0.25"/>
  <circle cx="256" cy="200" r="9" fill="#00eaff" fill-opacity="0.5"/>
  <circle cx="256" cy="200" r="4.5" fill="#ffffff" fill-opacity="0.85"/>

  <!-- === SECONDARY BUMP (smaller activation) === -->
  <!-- Represents multi-bump solution / interacting fields -->
  <g opacity="0.55">
    <ellipse cx="370" cy="250" rx="38" ry="36" fill="none" stroke="#7b61ff" stroke-width="0.7" stroke-opacity="0.2"/>
    <ellipse cx="370" cy="250" rx="26" ry="24" fill="none" stroke="#7b61ff" stroke-width="0.8" stroke-opacity="0.3"/>
    <ellipse cx="370" cy="250" rx="15" ry="14" fill="none" stroke="#7b61ff" stroke-width="1.0" stroke-opacity="0.4"/>
    <circle cx="370" cy="250" r="7" fill="#7b61ff" fill-opacity="0.3"/>
    <circle cx="370" cy="250" r="3.5" fill="#9b8aff" fill-opacity="0.6"/>
    <circle cx="370" cy="250" r="1.8" fill="#ffffff" fill-opacity="0.5"/>
  </g>

  <!-- === TERTIARY BUMP (emerging activation) === -->
  <g opacity="0.4">
    <ellipse cx="155" cy="270" rx="30" ry="28" fill="none" stroke="#00ff88" stroke-width="0.6" stroke-opacity="0.2"/>
    <ellipse cx="155" cy="270" rx="19" ry="18" fill="none" stroke="#00ff88" stroke-width="0.7" stroke-opacity="0.3"/>
    <ellipse cx="155" cy="270" rx="10" ry="9" fill="none" stroke="#00ff88" stroke-width="0.9" stroke-opacity="0.4"/>
    <circle cx="155" cy="270" r="5" fill="#00ff88" fill-opacity="0.25"/>
    <circle cx="155" cy="270" r="2.5" fill="#00ff88" fill-opacity="0.5"/>
    <circle cx="155" cy="270" r="1.2" fill="#ffffff" fill-opacity="0.4"/>
  </g>

  <!-- === FIELD INTERACTION ARCS === -->
  <!-- Coupling between bumps — lateral interactions w(x-x') -->
  <g opacity="0.25" filter="url(#glow-faint)">
    <!-- Primary ↔ Secondary coupling -->
    <path d="M 275 205 Q 320 210 365 245" fill="none" stroke="#7b61ff" stroke-width="0.8" stroke-dasharray="2 3"/>
    <path d="M 270 210 Q 325 225 360 248" fill="none" stroke="#00d4ff" stroke-width="0.5" stroke-opacity="0.5"/>
    <!-- Primary ↔ Tertiary coupling -->
    <path d="M 240 210 Q 200 230 160 265" fill="none" stroke="#00ff88" stroke-width="0.8" stroke-dasharray="2 3"/>
    <path d="M 242 215 Q 195 240 158 263" fill="none" stroke="#00d4ff" stroke-width="0.5" stroke-opacity="0.5"/>
    <!-- Secondary ↔ Tertiary (weak) -->
    <path d="M 350 260 Q 260 310 170 275" fill="none" stroke="#ff3d8e" stroke-width="0.5" stroke-dasharray="3 5" stroke-opacity="0.5"/>
  </g>

  <!-- === MEXICAN HAT KERNEL w(x) — signature of neural field theory === -->
  <!-- Rendered as a cross-section profile along the bottom -->
  <!-- This is the defining mathematical shape: excitatory center, inhibitory surround -->
  <g transform="translate(256, 358)" opacity="0.7">
    <!-- Axis line -->
    <line x1="-130" y1="0" x2="130" y2="0" stroke="#8888a0" stroke-width="0.5" stroke-opacity="0.3"/>
    <!-- Vertical axis -->
    <line x1="0" y1="30" x2="0" y2="-40" stroke="#8888a0" stroke-width="0.5" stroke-opacity="0.2"/>

    <!-- Mexican hat / Difference of Gaussians kernel curve -->
    <!-- w(x) = A_e * exp(-x²/2σ_e²) - A_i * exp(-x²/2σ_i²) -->
    <path d="M -120,8 C -110,10 -95,12 -80,10 C -65,7 -55,3 -45,-2 C -38,-6 -30,-12 -22,-20 C -15,-27 -8,-34 0,-38 C 8,-34 15,-27 22,-20 C 30,-12 38,-6 45,-2 C 55,3 65,7 80,10 C 95,12 110,10 120,8"
          fill="none" stroke="url(#kernel-grad)" stroke-width="2" filter="url(#glow-soft)"/>

    <!-- Fill under excitatory part (positive) -->
    <path d="M -45,-2 C -38,-6 -30,-12 -22,-20 C -15,-27 -8,-34 0,-38 C 8,-34 15,-27 22,-20 C 30,-12 38,-6 45,-2 Z"
          fill="#00d4ff" fill-opacity="0.06"/>

    <!-- Fill under inhibitory wings (negative — below axis) -->
    <path d="M -120,8 C -110,10 -95,12 -80,10 C -65,7 -55,3 -45,-2 L -45,0 L -120,0 Z"
          fill="#ff3d8e" fill-opacity="0.04"/>
    <path d="M 45,-2 C 55,3 65,7 80,10 C 95,12 110,10 120,8 L 120,0 L 45,0 Z"
          fill="#ff3d8e" fill-opacity="0.04"/>

    <!-- Labels -->
    <text x="0" y="-44" text-anchor="middle" fill="#00d4ff" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="7" fill-opacity="0.5">w(x)</text>
    <text x="135" y="3" text-anchor="start" fill="#8888a0" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="6.5" fill-opacity="0.35">x</text>
  </g>

  <!-- === THE FIELD EQUATION — mathematical soul === -->
  <!-- τ ∂u/∂t = -u + ∫w(x-x')f(u)dx' + s -->
  <text x="256" y="340" text-anchor="middle" fill="#8888a0" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="8.5" fill-opacity="0.25" letter-spacing="0.03em">
    τ ∂u/∂t = −u + ∫ w(|x−x′|) f(u(x′,t)) dx′ + s(x,t)
  </text>

  <!-- === NEOS WORDMARK === -->
  <text x="256" y="425" text-anchor="middle" fill="url(#text-grad)" font-family="'SF Pro Display', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="62" font-weight="800" letter-spacing="0.14em" filter="url(#glow-text)">NEOS</text>

  <!-- Tagline -->
  <text x="256" y="452" text-anchor="middle" fill="#8888a0" font-family="'SF Pro Display', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill-opacity="0.7">The last operating system will not manage files.</text>
  <text x="256" y="466" text-anchor="middle" fill="#8888a0" font-family="'SF Pro Display', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="10" fill-opacity="0.7">It will manage <tspan fill="#ffffff" font-weight="700">meaning</tspan>.</text>

  <!-- Subtitle -->
  <text x="256" y="488" text-anchor="middle" fill="#8888a0" font-family="'SF Pro Display', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="9.5" letter-spacing="0.25em" font-weight="400" fill-opacity="0.5">THE OPERATING SYSTEM FOR MACHINE INTELLIGENCE</text>

  <!-- Bottom accent -->
  <line x1="146" y1="498" x2="366" y2="498" stroke="url(#accent)" stroke-width="1" stroke-opacity="0.3"/>
</svg>
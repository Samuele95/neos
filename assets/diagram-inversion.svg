<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320">
  <defs>
    <linearGradient id="bg-inv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#07070c"/>
      <stop offset="50%" stop-color="#0c0816"/>
      <stop offset="100%" stop-color="#07070c"/>
    </linearGradient>
    <!-- Cyan glow filter for NEOS box -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#00d4ff" flood-opacity="0.25" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle glow for the arrow -->
    <filter id="glow-arrow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feFlood flood-color="#00d4ff" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Arrowhead markers -->
    <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#555"/>
    </marker>
    <marker id="arrowhead-return" markerWidth="6" markerHeight="4" refX="1" refY="2" orient="auto">
      <polygon points="6 0, 0 2, 6 4" fill="#444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="320" fill="url(#bg-inv)"/>

  <!-- Subtle dot grid -->
  <g opacity="0.03">
    <circle cx="50" cy="40" r="0.6" fill="#7b61ff"/><circle cx="100" cy="40" r="0.6" fill="#7b61ff"/><circle cx="150" cy="40" r="0.6" fill="#7b61ff"/><circle cx="200" cy="40" r="0.6" fill="#7b61ff"/><circle cx="250" cy="40" r="0.6" fill="#7b61ff"/><circle cx="300" cy="40" r="0.6" fill="#7b61ff"/><circle cx="350" cy="40" r="0.6" fill="#7b61ff"/><circle cx="400" cy="40" r="0.6" fill="#7b61ff"/><circle cx="450" cy="40" r="0.6" fill="#7b61ff"/><circle cx="500" cy="40" r="0.6" fill="#7b61ff"/><circle cx="550" cy="40" r="0.6" fill="#7b61ff"/><circle cx="600" cy="40" r="0.6" fill="#7b61ff"/><circle cx="650" cy="40" r="0.6" fill="#7b61ff"/>
    <circle cx="50" cy="80" r="0.6" fill="#7b61ff"/><circle cx="100" cy="80" r="0.6" fill="#7b61ff"/><circle cx="150" cy="80" r="0.6" fill="#7b61ff"/><circle cx="200" cy="80" r="0.6" fill="#7b61ff"/><circle cx="250" cy="80" r="0.6" fill="#7b61ff"/><circle cx="300" cy="80" r="0.6" fill="#7b61ff"/><circle cx="350" cy="80" r="0.6" fill="#7b61ff"/><circle cx="400" cy="80" r="0.6" fill="#7b61ff"/><circle cx="450" cy="80" r="0.6" fill="#7b61ff"/><circle cx="500" cy="80" r="0.6" fill="#7b61ff"/><circle cx="550" cy="80" r="0.6" fill="#7b61ff"/><circle cx="600" cy="80" r="0.6" fill="#7b61ff"/><circle cx="650" cy="80" r="0.6" fill="#7b61ff"/>
    <circle cx="50" cy="120" r="0.6" fill="#7b61ff"/><circle cx="100" cy="120" r="0.6" fill="#7b61ff"/><circle cx="150" cy="120" r="0.6" fill="#7b61ff"/><circle cx="200" cy="120" r="0.6" fill="#7b61ff"/><circle cx="250" cy="120" r="0.6" fill="#7b61ff"/><circle cx="300" cy="120" r="0.6" fill="#7b61ff"/><circle cx="350" cy="120" r="0.6" fill="#7b61ff"/><circle cx="400" cy="120" r="0.6" fill="#7b61ff"/><circle cx="450" cy="120" r="0.6" fill="#7b61ff"/><circle cx="500" cy="120" r="0.6" fill="#7b61ff"/><circle cx="550" cy="120" r="0.6" fill="#7b61ff"/><circle cx="600" cy="120" r="0.6" fill="#7b61ff"/><circle cx="650" cy="120" r="0.6" fill="#7b61ff"/>
    <circle cx="50" cy="160" r="0.6" fill="#7b61ff"/><circle cx="100" cy="160" r="0.6" fill="#7b61ff"/><circle cx="150" cy="160" r="0.6" fill="#7b61ff"/><circle cx="200" cy="160" r="0.6" fill="#7b61ff"/><circle cx="250" cy="160" r="0.6" fill="#7b61ff"/><circle cx="300" cy="160" r="0.6" fill="#7b61ff"/><circle cx="350" cy="160" r="0.6" fill="#7b61ff"/><circle cx="400" cy="160" r="0.6" fill="#7b61ff"/><circle cx="450" cy="160" r="0.6" fill="#7b61ff"/><circle cx="500" cy="160" r="0.6" fill="#7b61ff"/><circle cx="550" cy="160" r="0.6" fill="#7b61ff"/><circle cx="600" cy="160" r="0.6" fill="#7b61ff"/><circle cx="650" cy="160" r="0.6" fill="#7b61ff"/>
  </g>

  <!-- ============================================ -->
  <!-- LEFT SIDE: Today's Stack                     -->
  <!-- ============================================ -->

  <!-- "Today" label -->
  <text x="165" y="28" text-anchor="middle" fill="#888" font-family="system-ui, sans-serif" font-size="11" letter-spacing="0.15em" font-weight="600">TODAY</text>

  <!-- Applications box (outermost layer) -->
  <rect x="65" y="35" width="200" height="40" rx="4" ry="4" fill="none" stroke="#7b61ff" stroke-width="1.2"/>
  <text x="110" y="59" fill="#bbb" font-family="system-ui, sans-serif" font-size="11">Applications</text>
  <!-- LLM App (small highlighted rect inside Applications) -->
  <rect x="185" y="43" width="68" height="24" rx="3" ry="3" fill="rgba(255,61,142,0.1)" stroke="#ff3d8e" stroke-width="1"/>
  <text x="219" y="59" text-anchor="middle" fill="#ff3d8e" font-family="system-ui, sans-serif" font-size="9" font-weight="600">LLM App</text>

  <!-- Operating System box -->
  <rect x="65" y="80" width="200" height="40" rx="4" ry="4" fill="none" stroke="#555" stroke-width="1"/>
  <text x="165" y="104" text-anchor="middle" fill="#777" font-family="system-ui, sans-serif" font-size="11">Operating System</text>

  <!-- Hardware box -->
  <rect x="65" y="125" width="200" height="40" rx="4" ry="4" fill="none" stroke="#444" stroke-width="1"/>
  <text x="165" y="149" text-anchor="middle" fill="#666" font-family="system-ui, sans-serif" font-size="11">Hardware</text>

  <!-- ============================================ -->
  <!-- CENTER: Inversion Arrow                      -->
  <!-- ============================================ -->

  <g filter="url(#glow-arrow)">
    <text x="350" y="100" text-anchor="middle" fill="#00d4ff" font-family="system-ui, sans-serif" font-size="32" opacity="0.9">&#x21D2;</text>
  </g>
  <text x="350" y="122" text-anchor="middle" fill="#555" font-family="system-ui, sans-serif" font-size="9" font-style="italic" letter-spacing="0.1em">Inversion</text>

  <!-- ============================================ -->
  <!-- RIGHT SIDE: Tomorrow's Stack                 -->
  <!-- ============================================ -->

  <!-- "Tomorrow" label in cyan -->
  <text x="535" y="28" text-anchor="middle" fill="#00d4ff" font-family="system-ui, sans-serif" font-size="11" letter-spacing="0.15em" font-weight="600">TOMORROW</text>

  <!-- Human box -->
  <rect x="435" y="35" width="200" height="40" rx="4" ry="4" fill="none" stroke="#555" stroke-width="1"/>
  <text x="535" y="59" text-anchor="middle" fill="#999" font-family="system-ui, sans-serif" font-size="11">Human</text>

  <!-- NEOS box (glowing cyan, prominent) -->
  <g filter="url(#glow-cyan)">
    <rect x="435" y="80" width="200" height="40" rx="4" ry="4" fill="rgba(0,212,255,0.04)" stroke="#00d4ff" stroke-width="2"/>
  </g>
  <text x="535" y="105" text-anchor="middle" fill="#00d4ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em">NEOS</text>

  <!-- LLM (Foundation) box -->
  <rect x="435" y="125" width="200" height="40" rx="4" ry="4" fill="none" stroke="#7b61ff" stroke-width="1.2"/>
  <text x="535" y="149" text-anchor="middle" fill="#a08aff" font-family="system-ui, sans-serif" font-size="11">LLM (Foundation)</text>

  <!-- ============================================ -->
  <!-- BOTTOM: The NEOS REPL Cycle                  -->
  <!-- ============================================ -->

  <!-- Divider line -->
  <line x1="60" y1="190" x2="640" y2="190" stroke="#333" stroke-width="0.5" opacity="0.6"/>

  <!-- Section label -->
  <text x="350" y="212" text-anchor="middle" fill="#555" font-family="system-ui, sans-serif" font-size="9" letter-spacing="0.2em">THE NEOS REPL CYCLE</text>

  <!-- REPL cycle nodes -->
  <!-- Node 1: Inject Meaning -->
  <rect x="55" y="228" width="120" height="30" rx="4" ry="4" fill="rgba(123,97,255,0.06)" stroke="#7b61ff" stroke-width="0.8"/>
  <text x="115" y="247" text-anchor="middle" fill="#a08aff" font-family="system-ui, sans-serif" font-size="9.5" font-weight="500">Inject Meaning</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="178" y1="243" x2="200" y2="243" stroke="#555" stroke-width="0.8" marker-end="url(#arrowhead)"/>

  <!-- Node 2: Run Dynamics -->
  <rect x="203" y="228" width="120" height="30" rx="4" ry="4" fill="rgba(0,212,255,0.06)" stroke="#00d4ff" stroke-width="0.8"/>
  <text x="263" y="247" text-anchor="middle" fill="#00d4ff" font-family="system-ui, sans-serif" font-size="9.5" font-weight="500">Run Dynamics</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="326" y1="243" x2="348" y2="243" stroke="#555" stroke-width="0.8" marker-end="url(#arrowhead)"/>

  <!-- Node 3: Observe Emergence -->
  <rect x="351" y="228" width="130" height="30" rx="4" ry="4" fill="rgba(0,212,255,0.06)" stroke="#00d4ff" stroke-width="0.8"/>
  <text x="416" y="247" text-anchor="middle" fill="#00d4ff" font-family="system-ui, sans-serif" font-size="9.5" font-weight="500">Observe Emergence</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="484" y1="243" x2="506" y2="243" stroke="#555" stroke-width="0.8" marker-end="url(#arrowhead)"/>

  <!-- Node 4: Collapse to Insight -->
  <rect x="509" y="228" width="130" height="30" rx="4" ry="4" fill="rgba(255,61,142,0.06)" stroke="#ff3d8e" stroke-width="0.8"/>
  <text x="574" y="247" text-anchor="middle" fill="#ff3d8e" font-family="system-ui, sans-serif" font-size="9.5" font-weight="500">Collapse to Insight</text>

  <!-- Dashed return path -->
  <path d="M 574 261 L 574 278 Q 574 288 564 288 L 125 288 Q 115 288 115 278 L 115 261"
        fill="none" stroke="#444" stroke-width="0.8" stroke-dasharray="4,3"
        marker-end="url(#arrowhead-return)"/>

  <!-- Return path label -->
  <text x="350" y="300" text-anchor="middle" fill="#444" font-family="system-ui, sans-serif" font-size="8" font-style="italic" letter-spacing="0.05em">Save / Fork / Share</text>

</svg>
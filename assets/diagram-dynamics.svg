<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350">
  <defs>
    <!-- Arrowhead marker -->
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#555"/>
    </marker>
  </defs>

  <rect width="600" height="350" fill="#07070c"/>

  <!-- Connecting arrows (clockwise): drawn first so circles overlay the endpoints -->

  <!-- Phase 1 → Phase 2 -->
  <line x1="335" y1="75" x2="455" y2="105" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Phase 2 → Phase 3 -->
  <line x1="490" y1="160" x2="490" y2="210" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Phase 3 → Phase 4 -->
  <line x1="455" y1="265" x2="335" y2="295" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Phase 4 → Phase 5 -->
  <line x1="265" y1="295" x2="145" y2="265" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Phase 5 → Phase 6 -->
  <line x1="110" y1="210" x2="110" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Phase 6 → Phase 1 -->
  <line x1="145" y1="105" x2="265" y2="75" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Center label -->
  <text x="300" y="180" text-anchor="middle" fill="#333" font-family="system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="4">CYCLE</text>

  <!-- Phase 1: Decay (top center) -->
  <circle cx="300" cy="60" r="40" fill="rgba(255,61,142,0.1)" stroke="#ff3d8e" stroke-width="1.5"/>
  <text x="300" y="57" text-anchor="middle" fill="#ff3d8e" font-family="system-ui, sans-serif" font-size="12" font-weight="600">1. Decay</text>
  <text x="300" y="72" text-anchor="middle" fill="#ff3d8e" font-family="monospace" font-size="9" opacity="0.7">&#x2212;&#x03BB;A(x)</text>

  <!-- Phase 2: Resonate (top-right) -->
  <circle cx="490" cy="120" r="40" fill="rgba(0,212,255,0.1)" stroke="#00aaff" stroke-width="1.5"/>
  <text x="490" y="117" text-anchor="middle" fill="#00aaff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">2. Resonate</text>
  <text x="490" y="132" text-anchor="middle" fill="#00aaff" font-family="monospace" font-size="9" opacity="0.7">K(x,y)</text>

  <!-- Phase 3: Amplify (bottom-right) -->
  <circle cx="490" cy="250" r="40" fill="rgba(0,255,136,0.1)" stroke="#00ff88" stroke-width="1.5"/>
  <text x="490" y="247" text-anchor="middle" fill="#00ff88" font-family="system-ui, sans-serif" font-size="12" font-weight="600">3. Amplify</text>
  <text x="490" y="262" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="9" opacity="0.7">+&#x03B1;&#xB7;boost</text>

  <!-- Phase 4: Threshold (bottom center) -->
  <circle cx="300" cy="310" r="40" fill="rgba(255,215,0,0.1)" stroke="#ffdd00" stroke-width="1.5"/>
  <text x="300" y="307" text-anchor="middle" fill="#ffdd00" font-family="system-ui, sans-serif" font-size="12" font-weight="600">4. Threshold</text>
  <text x="300" y="322" text-anchor="middle" fill="#ffdd00" font-family="monospace" font-size="9" opacity="0.7">A &lt; &#x03C4; &#x2192; remove</text>

  <!-- Phase 5: Coherence (bottom-left) -->
  <circle cx="110" cy="250" r="40" fill="rgba(123,97,255,0.1)" stroke="#7b61ff" stroke-width="1.5"/>
  <text x="110" y="247" text-anchor="middle" fill="#7b61ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">5. Coherence</text>
  <text x="110" y="262" text-anchor="middle" fill="#7b61ff" font-family="monospace" font-size="9" opacity="0.7">&#x03BC;/(1+&#x03C3;&#xB2;)</text>

  <!-- Phase 6: Attractor (top-left) -->
  <circle cx="110" cy="120" r="40" fill="rgba(0,212,255,0.1)" stroke="#00aaff" stroke-width="1.5"/>
  <text x="110" y="117" text-anchor="middle" fill="#00aaff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">6. Attractor</text>
  <text x="110" y="132" text-anchor="middle" fill="#00aaff" font-family="monospace" font-size="9" opacity="0.7">detect &amp; record</text>
</svg>
